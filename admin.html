<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/main.css">
    <script defer src="js/Admin.js" type="module"></script>
    <title>MAI — Панель администратора</title>
</head>
<body class="admin-page">

    <main class="main">
        <section class="page-header page-header--admin">
            <div class="container">
                <div class="admin-header">
                    <div class="admin-header__info">
                        <span class="admin-header__badge">Учебная часть • Панель управления</span>
                        <h1 class="page-header__title">Заявки студентов</h1>
                        <p class="page-header__desc">
                            Контроль, обработка и изменение статусов справок и электронных документов.
                        </p>
                    </div>
                    <div class="admin-header__actions">
                        <button type="button" class="btn btn--danger" data-js-admin-logout>Выйти из системы</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="admin-panel">
                    <div class="admin-panel__table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Студент / Группа</th>
                                    <th>Документ</th>
                                    <th>Комментарий</th>
                                    <th>Дата подачи</th>
                                    <th>Статус</th>
                                    <th class="admin-table__th-actions">Действия</th>
                                </tr>
                            </thead>
                            <tbody data-js-admin-requests-list>
                                
                            </tbody>
                        </table>
                    </div>
                    <p class="admin-panel__message" data-js-admin-message></p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
